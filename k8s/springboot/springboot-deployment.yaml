apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot
spec:
  replicas: 1
  selector:
    matchLabels:
      component: springboot
  template:
    metadata:
      labels:
        component: springboot
    spec:
      containers:
        - name: springboot
          image: georgeestav/springboot
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: springboot-configmap

          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-config-secret
                  key: MYSQL_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-config-secret
                  key: MYSQL_PASSWORD
            - name: STRIPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-secret
                  key: STRIPE_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: foodsprint-jwt-secret
                  key: JWT_SECRET
          imagePullPolicy: Always

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"

            limits:
              memory: "1Gi"
              cpu: "1000m"
